# default.conf: Serve Jellyfin Vue on an unprivileged internal port.
#

server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;

    # Serve static assets and support history-mode browser routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

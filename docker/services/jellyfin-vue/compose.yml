# compose.yml: Maraudarr service chart for the optional Jellyfin Vue client.
#

services:
  #
  # Define the 'jellyfin-vue' service as an alternative browser client for the Jellyfin server.
  #
  jellyfin-vue:
    <<:                      # Merge shared container and security settings
      - *default-container   # Keep the image's nginx identity for startup config writes
      - *security-hardening  # Drop capabilities and prevent privilege escalation

    # Docker image and container information
    image: ghcr.io/jellyfin/jellyfin-vue:${JELLYFIN_VUE_TAG}                  # Upstream supports the unstable channel
    container_name: ${COMPOSE_PROJECT_NAME}-jellyfin-vue-${JELLYFIN_VUE_TAG}  # Namespace by project and tag
    hostname: jellyfin-vue                                                    # Internal frontend hostname

    # Configure browser behavior; URLs must be reachable from the user's device.
    environment:
      DEFAULT_SERVERS: ${JELLYFIN_VUE_DEFAULT_SERVERS}                    # Comma-separated browser-accessible Jellyfin URLs; empty prompts the user
      DISABLE_SERVER_SELECTION: ${JELLYFIN_VUE_DISABLE_SERVER_SELECTION}  # 1 hides server selection; requires a reachable default server; 0 allows selection
      HISTORY_ROUTER_MODE: ${JELLYFIN_VUE_HISTORY_ROUTER_MODE}            # 1 uses history routing; 0 uses hash routing

    # Publish only the frontend; browsers contact Jellyfin directly for playback.
    ports:
      - ${JELLYFIN_VUE_WEBUI_PORT}:8080  # Vue web UI port; separate from Jellyfin's 8096

    # Keep nginx on an unprivileged port even when the host restricts low ports.
    volumes:
      - type: bind                                 # Mount the generated nginx listener configuration
        source: ${JELLYFIN_VUE_NGINX_CONFIG_PATH}  # Seeded file; retain listen 8080 to match the port and probe
        target: /etc/nginx/conf.d/default.conf     # Override the upstream port 80 listener
        read_only: true                            # Keep the configuration under operator control
        bind:                                      # Reject a missing file instead of creating a directory
          create_host_path: false

    # Check static asset delivery without needing a running Jellyfin server.
    healthcheck:
      <<: *default-healthcheck-settings  # Reuse the stack healthcheck timing
      test:                              # Check the Vue frontend's configuration endpoint
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/config.json

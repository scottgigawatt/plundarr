# compose.yml: Maraudarr service chart for PATTRMM.
#

services:
  #
  # Define the 'pattrmm' service for Kometa helper metadata generation.
  #
  pattrmm:
    # Docker image and container information
    <<: *default-container                                          # Pull in the default container information
    image: ghcr.io/insertdisc/pattrmm:${PATTRMM_TAG}                # Run using the specified floating tag
    container_name: ${COMPOSE_PROJECT_NAME}-pattrmm-${PATTRMM_TAG}  # Namespace the container name by project and tag
    hostname: pattrmm                                               # Set the container hostname

    # Define the container environment
    environment:
      <<: *default-environment       # Pull in the default environment
      PATTRMM_TIME: ${PATTRMM_TIME}  # Set the daily run time
      PUID: ${PATTRMM_PUID}          # Set the host user ID
      GUID: ${PATTRMM_PGID}          # Set the host group ID expected by PATTRMM

    # Mount PATTRMM state and the independently managed Kometa configuration
    volumes:                                                # Mount application state and shared configuration
      - ${PATTRMM_CONFIG_PATH}/data:/data:rw                # Generated metadata and working data
      - ${PATTRMM_CONFIG_PATH}/preferences:/preferences:rw  # PATTRMM preferences and templates
      - ${KOMETA_CONFIG_PATH}:/config:rw                    # Kometa config and generated YAML files
      - type: bind                                          # Bind the existing runtime configuration file
        source: ${KOMETA_RUNTIME_CONFIG_PATH}               # Live config shared by Kometa and PATTRMM
        target: /config/config.yml                          # Expose the live config at its expected path
        bind:                                               # Configure bind mount behavior
          create_host_path: false                           # Fail if the source path does not exist

# compose.yml: Maraudarr service chart for an optional second Whisparr.
#

services:
  #
  # Define the 'whisparr-alt' service for a separate adult media library.
  #
  whisparr-alt:
    <<:  # Merge shared identity and application-specific runtime settings
      - *arr-stack-container  # Pull in arr-stack container config
      - *whisparr-runtime     # Share the writable media parent and ping probe

    # Docker image and container information
    image: ghcr.io/hotio/whisparr:${WHISPARR_ALT_TAG}                         # Run the floating v3 release channel
    container_name: ${COMPOSE_PROJECT_NAME}-whisparr-alt-${WHISPARR_ALT_TAG}  # Namespace the container name by project and tag
    hostname: whisparr-alt                                                    # Set the container hostname

    # Define the host and container ports
    ports:
      - ${WHISPARR_ALT_WEBUI_PORT}:6969  # Whisparr web UI port

    # Mount host directories into the container
    volumes:
      - ${WHISPARR_ALT_CONFIG_PATH}:/config:rw         # Persistent Whisparr configuration
      - ${WHISPARR_ALT_IMPORT_PATH}:/data/import:rw    # Shared staging directory for manual imports
      - ${WHISPARR_ALT_MOVIES_PATH}:/data/movies:rw    # Managed movie library
      - ${WHISPARR_ALT_SCENES_PATH}:/data/scenes:rw    # Managed scene library
      - ${WHISPARR_ALT_RECYCLE_PATH}:/data/recycle:rw  # Private recycling bin for this instance
      - ${HOST_DOWNLOADS_PATH}:/downloads:rw           # Shared download tree for imports and hardlinks

    # Specify container service dependencies
    depends_on: *wait-for-prowlarr  # Wait until the required indexer is healthy

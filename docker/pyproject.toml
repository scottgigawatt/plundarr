# pyproject.toml: Python package metadata and build settings for Maraudarr.
#

#
# Build the Maraudarr wheel with the exact setuptools release used by the image.
#
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

#
# Declare Maraudarr package metadata and exact runtime dependencies.
#
[project]
name = "maraudarr"
version = "0.1.0"
description = "Generate polished, reusable Plundarr Docker Compose stacks."
readme = "README.md"
requires-python = "==3.14.7"
license = "Apache-2.0"
authors = [
  { name = "Scott Gigawatt" },
]
# Keep terminal prompts and styled output reproducible across image builds.
dependencies = [
  "questionary==2.1.1",
  "rich==15.0.0",
]

#
# Install the public command used by the container entrypoint.
#
[project.scripts]
maraudarr = "maraudarr.cli:main"

#
# Map the package namespace to the conventional source-layout root.
#
[tool.setuptools]
package-dir = { "" = "src" }

#
# Find Maraudarr packages beneath the configured source-layout root.
#
[tool.setuptools.packages.find]
where = ["src"]

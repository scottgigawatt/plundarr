#
# catalog.toml: Maraudarr service metadata, dependency rules, output order,
#               and named Plundarr stack presets.
#

#
# Service table fields:
#   title       - Human-readable name shown in the Maraudarr interface.
#   description - Short explanation shown in service lists and prompts.
#   category    - Prompt group used by the interactive configurator.
#   url         - Upstream project URL added to the generated Compose header.
#   order       - Stable numeric position in Compose and environment output.
#   service     - Optional Compose service key when it differs from the ID.
#   requires    - Services automatically added when this service is selected.
#   recommended - Related services shown as guidance but not forced.
#
# Compose, environment, and config sources use this conventional layout:
#   services/<service-id>/compose.yml
#   services/<service-id>/environment.env
#   services/<service-id>/config/
#
# Preset tables also define the generated project name, network defaults,
# high-level media root, expected libraries, and optional host-port offset.
#

#
# VPN foundation services.
#
# Privateerr produces the PIA WireGuard material consumed by Gluetun.
[services.privateerr]
title = "Privateerr"
description = "Generates the PIA WireGuard configuration and Gluetun metadata."
category = "VPN foundation"
url = "https://github.com/scottgigawatt/privateerr"
order = 100

# Gluetun provides the protected network namespace for selected download clients.
[services.gluetun]
title = "Gluetun"
description = "Runs the VPN tunnel and protects selected download clients."
category = "VPN foundation"
url = "https://github.com/qdm12/gluetun"
order = 110
requires = ["privateerr"]

#
# Indexing and download services.
#
# FlareSolverr is an optional Prowlarr dependency for supported anti-bot sites.
[services.flaresolverr]
title = "FlareSolverr"
description = "Helps Prowlarr handle supported anti-bot challenges."
category = "Indexing"
url = "https://github.com/FlareSolverr/FlareSolverr"
order = 200

# Prowlarr centralizes indexers for every selected automation service.
[services.prowlarr]
title = "Prowlarr"
description = "Manages indexers shared by the media automation services."
category = "Indexing"
url = "https://github.com/Prowlarr/Prowlarr"
order = 210
requires = ["flaresolverr"]

# qBittorrent is the default torrent downloader for Plundarr and Boudoirr.
[services.qbittorrent]
title = "qBittorrent"
description = "Downloads torrents through the Gluetun VPN tunnel."
category = "Download clients"
url = "https://github.com/qbittorrent/qBittorrent"
order = 220
requires = ["gluetun"]

# SABnzbd is an explicit Usenet downloader choice.
[services.sabnzbd]
title = "SABnzbd"
description = "Downloads Usenet cargo through the Gluetun VPN tunnel."
category = "Download clients"
url = "https://sabnzbd.org"
order = 230
requires = ["gluetun"]

# NZBGet is the alternative explicit Usenet downloader choice.
[services.nzbget]
title = "NZBGet"
description = "Downloads Usenet cargo efficiently through the Gluetun VPN tunnel."
category = "Download clients"
url = "https://nzbget.com"
order = 240
requires = ["gluetun"]

#
# Media automation services.
#
# Radarr manages movie discovery, downloads, and library organization.
[services.radarr]
title = "Radarr"
description = "Finds, tracks, and organizes movies."
category = "Media automation"
url = "https://github.com/Radarr/Radarr"
order = 300
requires = ["prowlarr"]

# Sonarr manages television discovery, downloads, and library organization.
[services.sonarr]
title = "Sonarr"
description = "Finds, tracks, and organizes television shows."
category = "Media automation"
url = "https://github.com/Sonarr/Sonarr"
order = 310
requires = ["prowlarr"]

# Sonarr Anime is a second, optional Sonarr instance with its own configuration.
[services.sonarr-anime]
title = "Sonarr Anime"
description = "Runs a second Sonarr instance dedicated to anime television."
category = "Media automation"
url = "https://github.com/Sonarr/Sonarr"
order = 320
requires = ["prowlarr"]

# Whisparr manages Boudoirr's adult-media workflow.
[services.whisparr]
title = "Whisparr"
description = "Finds, tracks, and organizes an adult media library."
category = "Media automation"
url = "https://github.com/Whisparr/Whisparr"
order = 330
requires = ["prowlarr"]
recommended = ["qbittorrent"]

# Bazarr adds subtitle automation to the Radarr and Sonarr libraries.
[services.bazarr]
title = "Bazarr"
description = "Fetches subtitles for movie and television libraries."
category = "Media automation"
url = "https://github.com/morpheus65535/bazarr"
order = 340
requires = ["radarr", "sonarr"]

# Lidarr manages music discovery, downloads, and library organization.
[services.lidarr]
title = "Lidarr"
description = "Finds, tracks, and organizes music."
category = "Media automation"
url = "https://github.com/Lidarr/Lidarr"
order = 350
requires = ["prowlarr"]
recommended = ["qbittorrent"]

# Recyclarr applies version-controlled quality guidance to selected arr services.
[services.recyclarr]
title = "Recyclarr"
description = "Syncs curated quality profiles and custom formats to Radarr and Sonarr."
category = "Media automation"
url = "https://recyclarr.dev"
order = 360
requires = ["radarr", "sonarr"]

#
# Media request, playback, and dashboard services.
#
# Seerr provides a request interface without requiring a particular media server.
[services.seerr]
title = "Seerr"
description = "Accepts and manages media requests."
category = "Media experience"
url = "https://github.com/seerr-team/seerr"
order = 400

# Plex is an explicitly selected media server with separate read-only libraries.
[services.plex]
title = "Plex"
description = "Streams selected media libraries with Plex Media Server."
category = "Media servers"
url = "https://www.plex.tv/media-server-downloads/"
order = 410

# Jellyfin is an explicitly selected media server with one writable /data root.
[services.jellyfin]
title = "Jellyfin"
description = "Streams selected media libraries with an open media server."
category = "Media servers"
url = "https://jellyfin.org"
order = 420

# Calibre-Web Automated manages one Calibre ebook library and ingest directory.
[services.calibre-web-automated]
title = "Calibre-Web Automated"
description = "Manages, serves, and automatically ingests an ebook library."
category = "Media servers"
url = "https://github.com/crocodilestick/Calibre-Web-Automated"
order = 425

# Kometa manages Plex collections, metadata, and overlays from an external config tree.
[services.kometa]
title = "Kometa"
description = "Manages Plex collections, metadata, and overlays on a schedule."
category = "Plex utilities"
url = "https://kometa.wiki"
order = 430

# ImageMaid reports on and cleans Plex artwork from its application data tree.
[services.imagemaid]
title = "ImageMaid"
description = "Reports on and cleans Plex artwork with operator-selected safeguards."
category = "Plex utilities"
url = "https://kometa.wiki/en/latest/kometa/scripts/imagemaid/"
order = 440

# PATTRMM remains a removable Kometa helper rather than a Duplex core service.
[services.pattrmm]
title = "PATTRMM"
description = "Generates returning-soon metadata and overlays for Kometa."
category = "Plex utilities"
url = "https://github.com/InsertDisc/pattrmm"
order = 450
requires = ["kometa"]

# Tautulli records Plex activity and usage history.
[services.tautulli]
title = "Tautulli"
description = "Monitors Plex activity, history, and usage statistics."
category = "Plex utilities"
url = "https://tautulli.com"
order = 460

# Homepage is the optional dashboard for the generated fleet.
[services.homepage]
title = "Homepage"
description = "Provides a dashboard for the generated service fleet."
category = "Media experience"
url = "https://gethomepage.dev/latest"
order = 800

#
# Cleanup, monitoring, notification, backup, and update services.
#
# Cleanuparr is the default cleanup companion for qBittorrent-based presets.
[services.cleanuparr]
title = "Cleanuparr"
description = "Removes blocked or unwanted downloads from configured clients."
category = "Operations"
url = "https://github.com/Cleanuparr/Cleanuparr"
order = 500
recommended = ["qbittorrent"]

# Speedtest Tracker records network performance for the selected deployment.
[services.speedtest-tracker]
title = "Speedtest Tracker"
description = "Measures and records internet performance over time."
category = "Monitoring and notifications"
url = "https://docs.speedtest-tracker.dev"
order = 600

# Apprise is the optional notification endpoint used by supported services.
[services.apprise]
title = "Apprise"
description = "Delivers Speedtest Tracker and other notifications."
category = "Monitoring and notifications"
url = "https://github.com/caronc/apprise-api"
order = 610
recommended = ["speedtest-tracker"]

# Notifiarr connects the host and media applications to Notifiarr notifications.
[services.notifiarr]
title = "Notifiarr"
description = "Connects the Docker host and media applications to Notifiarr."
category = "Monitoring and notifications"
url = "https://notifiarr.wiki/pages/client/install/"
order = 620

# Duplicati backs up selected configuration and host data.
[services.duplicati]
title = "Duplicati"
description = "Backs up Plundarr configuration and other selected data."
category = "Operations"
url = "https://www.duplicati.com"
order = 700

# Watchtower defaults into automation presets and anchors its standalone preset.
[services.watchtower]
title = "Watchtower"
description = "Updates eligible Docker host containers on a schedule or in one pass."
category = "Operations"
url = "https://github.com/nicholas-fedor/watchtower"
order = 900

# Overlay Reset is profile-gated and runs only through an explicit one-shot command.
[services.overlay-reset]
title = "Kometa Overlay Reset"
description = "Provides a dry-run-first, one-shot repair tool for Plex overlays."
category = "Operations"
url = "https://kometa.wiki/en/latest/kometa/scripts/overlay-reset/"
order = 910
requires = ["kometa"]

#
# Plundarr is the default general-purpose media automation voyage.
#
# This preset combines automation, requests, ebooks, monitoring, backup, and qBittorrent.
[presets.plundarr]
title = "Plundarr"
description = "Movies, television, subtitles, ebooks, requests, monitoring, and a VPN-protected torrent client."
project_name = "plundarr"
network_subnet = "172.20.0.0/16"
network_ip_range = "172.20.5.0/24"
network_gateway = "172.20.5.254"
media_root = "/volume1/plex"
media_libraries = ["movies", "tv", "anime"]
host_port_offset = 0
compose_summary = [
  "docker-compose.yml: Docker Compose configuration for running Plundarr's",
  "                    media service stack with Privateerr-generated PIA",
  "                    WireGuard config, PIA port forwarding, Gluetun VPN",
  "                    routing, and the 'arr' applications.",
  "",
  "This configuration sets up default properties for all containers, integrates",
  "PIA with native WireGuard connections and port forwarding, and provides",
  "environment-specific settings for a seamless VPN setup.",
]
core = [
  "privateerr",
  "gluetun",
  "flaresolverr",
  "prowlarr",
  "radarr",
  "sonarr",
  "bazarr",
  "seerr",
  "speedtest-tracker",
  "duplicati",
  "homepage",
]
defaults = ["qbittorrent", "calibre-web-automated", "cleanuparr", "watchtower"]

#
# Boudoirr reuses the same catalog for an adult-media-focused stack.
#
# This preset uses Whisparr with movies and scenes beneath one media root.
[presets.boudoirr]
title = "Boudoirr"
description = "Whisparr-focused automation with one VPN-protected torrent client by default."
project_name = "boudoirr"
network_subnet = "172.21.0.0/16"
network_ip_range = "172.21.5.0/24"
network_gateway = "172.21.5.254"
media_root = "/volume1/jellyfin"
media_libraries = ["movies", "scenes"]
host_port_offset = 10000
compose_summary = [
  "docker-compose.yml: Docker Compose configuration for running Boudoirr's",
  "                    adult-media service stack with Privateerr-generated PIA",
  "                    WireGuard config, PIA port forwarding, Gluetun VPN",
  "                    routing, and the supporting applications.",
  "",
  "This configuration sets up default properties for all containers, integrates",
  "PIA with native WireGuard connections and port forwarding, and provides",
  "environment-specific settings for a seamless VPN setup.",
]
core = ["privateerr", "gluetun", "flaresolverr", "prowlarr", "whisparr"]
defaults = ["qbittorrent", "cleanuparr", "watchtower"]

#
# Jellyfin keeps the standalone deployment deliberately small.
#
# This preset renders only Jellyfin with movies and television libraries.
[presets.jellyfin]
title = "Jellyfin"
description = "A standalone Jellyfin server with movies and television beneath one media root."
project_name = "jellyfin"
network_subnet = "172.22.0.0/16"
network_ip_range = "172.22.5.0/24"
network_gateway = "172.22.5.254"
media_root = "/volume1/jellyfin"
media_libraries = ["movies", "tv"]
host_port_offset = 20000
compose_summary = [
  "docker-compose.yml: Docker Compose configuration for running a standalone",
  "                    Jellyfin media server on Plundarr's shared foundation.",
  "",
  "Jellyfin receives one writable /data mount containing the media libraries",
  "and separate persistent configuration and cache directories.",
]
core = ["jellyfin"]
defaults = []

#
# Plex mirrors the focused standalone Jellyfin preset.
#
# This preset renders only Plex with movies and television libraries.
[presets.plex]
title = "Plex"
description = "A standalone Plex server with movie and television libraries."
project_name = "plex"
network_subnet = "172.23.0.0/16"
network_ip_range = "172.23.5.0/24"
network_gateway = "172.23.5.254"
media_root = "/volume1/plex"
media_libraries = ["movies", "tv"]
host_port_offset = 0
compose_summary = [
  "docker-compose.yml: Docker Compose configuration for running a standalone",
  "                    Plex Media Server on Plundarr's shared foundation.",
  "",
  "Plex receives focused movie and television library mounts plus persistent",
  "configuration and transcode directories.",
]
core = ["plex"]
defaults = []

#
# Calibre-Web Automated keeps the standalone ebook deployment focused.
#
# This preset renders CWA with separate config, ingest, and library mounts.
[presets.calibre-web-automated]
title = "Calibre-Web Automated"
description = "A standalone Calibre-Web Automated ebook library and ingest service."
project_name = "calibre-web-automated"
network_subnet = "172.24.0.0/16"
network_ip_range = "172.24.5.0/24"
network_gateway = "172.24.5.254"
media_root = "/volume1/books/calibre"
media_libraries = []
host_port_offset = 40000
compose_summary = [
  "docker-compose.yml: Docker Compose configuration for running a standalone",
  "                    Calibre-Web Automated ebook library on Plundarr's",
  "                    shared foundation.",
  "",
  "CWA receives separate application, destructive ingest, and Calibre library",
  "mounts while image updates remain under operator control.",
]
core = ["calibre-web-automated"]
defaults = []

#
# Duplex collects Plex maintenance, monitoring, notifications, and recovery.
#
# PATTRMM and the operational companions remain removable preset defaults.
[presets.duplex]
title = "Duplex"
description = "Plex metadata, artwork, monitoring, notifications, and recovery tools."
project_name = "duplex"
network_subnet = "172.25.0.0/16"
network_ip_range = "172.25.5.0/24"
network_gateway = "172.25.5.254"
media_root = "/volume1/plex"
media_libraries = []
host_port_offset = 0
compose_summary = [
  "docker-compose.yml: Docker Compose configuration for running Duplex's",
  "                    Plex metadata, artwork, monitoring, notification,",
  "                    and recovery utilities.",
  "",
  "Kometa uses an external configuration checkout. Overlay Reset stays behind",
  "the tools profile and runs only when explicitly invoked as a one-shot job.",
]
core = ["kometa", "imagemaid", "tautulli"]
defaults = ["pattrmm", "notifiarr", "overlay-reset"]

#
# Watchtower provides a focused host-wide container update project.
#
# This preset runs one persistent updater and also supports one-shot execution.
[presets.watchtower]
title = "Watchtower"
description = "A standalone updater for eligible containers on one Docker host."
project_name = "watchtower"
network_subnet = "172.27.0.0/16"
network_ip_range = "172.27.5.0/24"
network_gateway = "172.27.5.254"
media_root = "/volume1/plex"
media_libraries = []
host_port_offset = 0
compose_summary = [
  "docker-compose.yml: Docker Compose configuration for running Watchtower",
  "                    persistently or as one host-wide update pass.",
  "",
  "Watchtower uses the Docker socket to update eligible host containers.",
  "Containers with an explicit disable label remain outside its control.",
]
core = ["watchtower"]
defaults = []

#
# Custom starts empty so every service choice is explicit.
#
# This preset has no services until the operator chooses them.
[presets.custom]
title = "Custom"
description = "Begin with an empty cargo hold and select every service yourself."
project_name = "custom"
network_subnet = "172.28.0.0/16"
network_ip_range = "172.28.5.0/24"
network_gateway = "172.28.5.254"
media_root = "/volume1/plex"
media_libraries = ["movies", "tv"]
host_port_offset = 30000
compose_summary = [
  "docker-compose.yml: Docker Compose configuration generated from Maraudarr's",
  "                    selectable media service catalog.",
  "",
  "This configuration contains the services selected for this custom stack and",
  "uses environment variables for settings that may change after deployment.",
]
core = []
defaults = []

# .trivyignore.yaml: Temporary, path-scoped exceptions for vulnerabilities in
#                    Maraudarr's upstream Compose validation binary.
#

vulnerabilities:
  #
  # Docker Compose carries the Go module-verification CVEs, but Maraudarr never
  # downloads modules or contacts GOPROXY or GOSUMDB. Keep both exceptions
  # scoped to the offline validation binary until an upstream release updates
  # golang.org/x/mod.
  #
  - id: CVE-2026-56864
    paths:
      - usr/local/bin/docker-compose
    expired_at: 2026-09-15
    statement: >-
      Maraudarr invokes only offline Compose config with networking disabled;
      the vulnerable GOSUMDB module-download path is unreachable.

  - id: CVE-2026-56865
    paths:
      - usr/local/bin/docker-compose
    expired_at: 2026-09-15
    statement: >-
      Maraudarr invokes only offline Compose config with networking disabled;
      the vulnerable GOPROXY module-download path is unreachable.

  #
  # Docker Compose also carries SSH-server and gRPC-server CVEs, but Maraudarr
  # exposes neither interface. Keep both exceptions scoped to the offline
  # validation binary until an upstream stable release updates the Go modules.
  #
  - id: CVE-2026-56854
    paths:
      - usr/local/bin/docker-compose
    expired_at: 2026-09-15
    statement: >-
      Maraudarr invokes only offline Compose config with networking disabled;
      it never starts the vulnerable SSH authentication server path.

  - id: CVE-2026-84304
    paths:
      - usr/local/bin/docker-compose
    expired_at: 2026-09-15
    statement: >-
      Maraudarr invokes only offline Compose config with networking disabled;
      it never starts the vulnerable gRPC HTTP/2 server path.

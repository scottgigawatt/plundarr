# .trivyignore.yaml: Temporary, path-scoped exceptions for vulnerabilities in
#                    Maraudarr's upstream Docker validation binaries.
#

vulnerabilities:
  - id: CVE-2026-34040
    paths:
      - usr/local/libexec/docker/cli-plugins/docker-compose
    expired_at: 2026-08-31
    statement: >-
      Maraudarr invokes only docker compose config without a Docker socket;
      the vulnerable Moby daemon authorization-plugin path is unreachable.
  - id: CVE-2026-33818
    paths:
      - usr/local/bin/docker
    expired_at: 2026-08-31
    statement: >-
      Maraudarr invokes only offline docker compose config validation; the
      vulnerable Go parser is unreachable while the official CLI is rebuilt.
  - id: CVE-2026-39821
    paths:
      - usr/local/bin/docker
    expired_at: 2026-08-31
    statement: >-
      Maraudarr invokes only offline docker compose config validation; the
      vulnerable Go network path is unreachable while the CLI is rebuilt.
  - id: CVE-2026-46600
    paths:
      - usr/local/bin/docker
    expired_at: 2026-08-31
    statement: >-
      Maraudarr invokes only offline docker compose config validation; the
      vulnerable Go DNS parser is unreachable while the CLI is rebuilt.
  - id: CVE-2026-56853
    paths:
      - usr/local/bin/docker
    expired_at: 2026-08-31
    statement: >-
      Maraudarr invokes only offline docker compose config validation; the
      vulnerable Go HTTP/2 path is unreachable while the CLI is rebuilt.
  - id: CVE-2026-56858
    paths:
      - usr/local/bin/docker
    expired_at: 2026-08-31
    statement: >-
      Maraudarr invokes only offline docker compose config validation; the

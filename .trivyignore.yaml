# .trivyignore.yaml: Temporary, path-scoped exceptions for vulnerabilities in
#                    Maraudarr's upstream Docker Compose validation binary.
#

vulnerabilities:
  - id: CVE-2026-34040
    paths:
      - usr/local/libexec/docker/cli-plugins/docker-compose
    expired_at: 2026-08-31
    statement: >-
      Maraudarr invokes only docker compose config without a Docker socket;
      the vulnerable Moby daemon authorization-plugin path is unreachable.

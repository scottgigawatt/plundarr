# build-and-push.yml: Validate, publish, attest, mirror, and announce Maraudarr.
#

name: "Hoist Maraudarr to the Registry 🏴‍☠️"

#
# Publish changed builds from main and semantic-version tags. The weekly run
# refreshes the moving edge image even when the repository source is unchanged.
# Manual dispatch remains available for an explicit rebuild or recovery run.
#
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "docker/**"
      - "docker-compose.maraudarr.yml"
      - "example.maraudarr.env"
      - "test/generator/**"
      - "test/helpers/**"
      - "test/stubs/**"
      - "scripts/compose/**"
      - "Makefile"
      - "LICENSE"
      - "docs/DOCKERHUB_README.md"
      - ".github/scripts/notify-discord.sh"
      - ".github/scripts/registry-mirror.sh"
      - ".github/workflows/build-and-push.yml"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  #
  # Prove that the generator, image, hardened runtime, and dependency scan all
  # pass before any registry receives a new manifest.
  #
  test-image:
    name: "Inspect Maraudarr's Tools 🧪"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      #
      # Check out without retaining credentials, then exercise the same local
      # test entrypoint contributors use before building the image.
      #
      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # Run the Maraudarr generator against the checked-in presets and service
      # definitions to ensure they all produce valid stacks.
      #
      - name: "Test the Stack Charts 🔎"
        run: make test

      #
      # Build one local architecture for runtime and vulnerability inspection.
      # The later publishing job owns the multi-architecture registry build.
      #
      - name: "Build the Local Maraudarr Image ⚒️"
        run: >-
          make build
          MARAUDARR_IMAGE=ghcr.io/${{ github.repository_owner }}/maraudarr:scan
          MARAUDARR_BUILD_OPTIONS=--pull

      #
      # Run the hardened smoke voyage with a Plundarr preset and a few selectable
      # services. This exercises the generator and the hardened image together.
      #
      - name: "Run the Hardened Smoke Voyage ⚓"
        run: >-
          make test-image
          MARAUDARR_IMAGE=ghcr.io/${{ github.repository_owner }}/maraudarr:scan
          MARAUDARR_TEST_PRESET=plundarr
          MARAUDARR_TEST_ADD=apprise,jellyfin
          MARAUDARR_TEST_FILE=config/homepage/services.yaml

      #
      # Keep HIGH and CRITICAL fixed vulnerabilities out of the published image.
      # Repository exceptions remain path-scoped and time-limited separately.
      #
      - name: "Scan Maraudarr for Bilge Rot 🔍"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/maraudarr:scan
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: 1

  #
  # Publish only after validation succeeds. This job owns registry credentials,
  # OCI metadata, provenance, cross-registry mirroring, and release notices.
  #
  publish-image:
    name: "Publish the Multi-Arch Fleet 📦"
    if: github.event_name != 'pull_request'
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/maraudarr
      DOCKERHUB_IMAGE: docker.io/${{ github.repository_owner }}/maraudarr
      IMAGE_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

    steps:
      #
      # Check out without persistent credentials so the notification helper and
      # release source are available before any registry action begins.
      #
      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # Announce the start independently to each configured Discord destination.
      # Missing optional webhooks deliberately skip without failing publication.
      #
      - name: "Notify Discord: shipyard opened 📣"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          IMAGE_PLATFORMS: ${{ env.IMAGE_PLATFORMS }}
        run: |
          sh .github/scripts/notify-discord.sh \
              --event           start \
              --template        shipyard \
              --run-url         "${RUN_URL}" \
              --repository      "${REPOSITORY}" \
              --ref-name        "${REF_NAME}" \
              --workflow-name   "${WORKFLOW_NAME}" \
              --actor           "${ACTOR}" \
              --platforms       "${IMAGE_PLATFORMS}" \
              --ghcr-image      "${GHCR_IMAGE}" \
              --dockerhub-image "${DOCKERHUB_IMAGE}"

      - name: "Notify Hades Discord: kraken awakened 🦑"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_HADES_HOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          IMAGE_PLATFORMS: ${{ env.IMAGE_PLATFORMS }}
        run: |
          sh .github/scripts/notify-discord.sh \
              --event           start \
              --template        kraken \
              --run-url         "${RUN_URL}" \
              --repository      "${REPOSITORY}" \
              --ref-name        "${REF_NAME}" \
              --workflow-name   "${WORKFLOW_NAME}" \
              --actor           "${ACTOR}" \
              --platforms       "${IMAGE_PLATFORMS}" \
              --ghcr-image      "${GHCR_IMAGE}" \
              --dockerhub-image "${DOCKERHUB_IMAGE}"

      - name: "Summon Cross-Arch Cannons 🧨"
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4

      - name: "Sharpen the Build Axe 🪓"
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: "Board the GHCR Galleon 🔐"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #
      # Derive edge, commit, semantic-version, and latest tags from the ref. The
      # timestamp step supplies reproducible OCI release metadata to the build.
      #
      - name: "Chart Stable and Edge Tags 🏷️"
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: "Stamp the Build Time ⏱️"
        id: build-data
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      #
      # Build once, push the multi-architecture result to GHCR, attach SBOM and
      # provenance data, and publish a registry-backed build attestation.
      #
      - name: "Publish the Maraudarr Image 🚢"
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.title=Maraudarr
            index:org.opencontainers.image.description=Generate polished, reusable Plundarr Docker Compose stacks and config directories.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
          build-args: |
            ALPINE_TAG=3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
            DOCKER_COMPOSE_TAG=v5.5.0@sha256:962d5ea7017e5ef425bfa47e492efa2c27d0492e8af58c497011e73b2ce98ee0
            IMAGE_CREATED=${{ steps.build-data.outputs.created }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.metadata.outputs.version }}
          sbom: true
          provenance: true

      - name: "Stamp the Provenance Scroll 🧾"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      #
      # Copy every generated GHCR tag to Docker Hub without rebuilding. Digest
      # comparison then proves both registries expose the same manifest content.
      #
      - name: "Install the Registry Mirror 🪞"
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: "Mirror Every Tag to Docker Hub 🐳"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          sh .github/scripts/registry-mirror.sh \
              --mirror \
              --ghcr-image         "${GHCR_IMAGE}" \
              --dockerhub-image    "${DOCKERHUB_IMAGE}" \
              --ghcr-username      "${GHCR_USERNAME}" \
              --dockerhub-username "${DOCKERHUB_USERNAME}" \
              --published-tags     "${PUBLISHED_TAGS}"

      - name: "Verify the Registry Mirrors 🔎"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          sh .github/scripts/registry-mirror.sh \
              --verify \
              --ghcr-image         "${GHCR_IMAGE}" \
              --dockerhub-image    "${DOCKERHUB_IMAGE}" \
              --ghcr-username      "${GHCR_USERNAME}" \
              --dockerhub-username "${DOCKERHUB_USERNAME}" \
              --published-tags     "${PUBLISHED_TAGS}"

      #
      # Keep the Docker Hub landing page synchronized with the checked-in public
      # image documentation after the registry contents have been verified.
      #
      - name: "Update the Docker Hub Chart 📘"
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository_owner }}/maraudarr
          short-description: "Generate polished Plundarr Docker Compose stacks from presets and selectable services."
          readme-filepath: ./docs/DOCKERHUB_README.md

      #
      # Report the final job state to both optional Discord destinations. These
      # steps run on success or failure so a broken voyage never disappears.
      #
      - name: "Notify Discord: build verdict 📣"
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          GHCR_PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/maraudarr
          DOCKERHUB_URL: https://hub.docker.com/r/${{ github.repository_owner }}/maraudarr
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          sh .github/scripts/notify-discord.sh \
              --event            verdict \
              --template         shipyard \
              --run-url          "${RUN_URL}" \
              --repository       "${REPOSITORY}" \
              --ref-name         "${REF_NAME}" \
              --job-status       "${JOB_STATUS}" \
              --ghcr-image       "${GHCR_IMAGE}" \
              --ghcr-package-url "${GHCR_PACKAGE_URL}" \
              --dockerhub-url    "${DOCKERHUB_URL}" \
              --published-tags   "${PUBLISHED_TAGS}" \
              --published-digest "${PUBLISHED_DIGEST}"

      - name: "Notify Hades Discord: kraken verdict 🦑"
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_HADES_HOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          GHCR_PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/maraudarr
          DOCKERHUB_URL: https://hub.docker.com/r/${{ github.repository_owner }}/maraudarr
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          sh .github/scripts/notify-discord.sh \
              --event            verdict \
              --template         kraken \
              --run-url          "${RUN_URL}" \
              --repository       "${REPOSITORY}" \
              --ref-name         "${REF_NAME}" \
              --job-status       "${JOB_STATUS}" \
              --ghcr-image       "${GHCR_IMAGE}" \
              --ghcr-package-url "${GHCR_PACKAGE_URL}" \
              --dockerhub-url    "${DOCKERHUB_URL}" \
              --published-tags   "${PUBLISHED_TAGS}" \
              --published-digest "${PUBLISHED_DIGEST}"

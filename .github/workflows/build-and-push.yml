#
# build-and-push.yml: Validate, publish, attest, mirror, and announce Maraudarr.
#

name: "Hoist Maraudarr to the Registry 🏴‍☠️"

#
# Publish changed builds from main and semantic-version tags. The weekly run
# refreshes the moving edge image even when the repository source is unchanged.
# Manual dispatch remains available for an explicit rebuild or recovery run.
#
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - ".trivyignore.yaml"
      - "docker/**"
      - "docker-compose.maraudarr.yml"
      - "example.maraudarr.env"
      - "test/generator/**"
      - "test/helpers/**"
      - "test/stubs/**"
      - "scripts/compose/**"
      - "examples/presets/**"
      - "ruff.toml"
      - "pyrightconfig.json"
      - "test/typing/**"
      - ".pre-commit-config.yaml"
      - "Makefile"
      - "LICENSE"
      - "docs/docker-hub-description.md"
      - ".github/discord/**"
      - ".github/scripts/discord-notifier.sh"
      - ".github/scripts/registry-mirror.sh"
      - ".github/scripts/validate-release-tag.sh"
      - ".github/workflows/build-and-push.yml"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  #
  # Announce eligible image pipelines independently of validation and registry credentials.
  # Delivery failures never change publication results or stop another destination.
  #
  notify-start:
    name: "Open the Image Wardrobe 📣 (${{ matrix.image-name }}, ${{ matrix.profile }})"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: maraudarr
            image-name: Maraudarr
            profile: image-primary
            dockerhub: true
          - image: maraudarr
            image-name: Maraudarr
            profile: image-secondary
            dockerhub: true

    steps:
      #
      # Read notification assets without retaining repository credentials.
      #
      - name: "Unpack the Notification Wardrobe 🧰"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # Name only the two notification secrets and keep webhook values out of logs.
      # Guard both routes so an unset webhook cannot select the other server.
      #
      - name: "Notify Discord: image pipeline started 📣"
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ matrix.profile == 'image-primary' && secrets.DISCORD_WEBHOOK_URL || matrix.profile == 'image-secondary' && secrets.DISCORD_HADES_HOOK_URL || '' }}
          IMAGE_NAME: ${{ matrix.image-name }}
          PROFILE: ${{ matrix.profile }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          ACTOR: ${{ github.actor }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DOCKERHUB_IMAGE: ${{ matrix.dockerhub && format('docker.io/{0}/{1}', github.repository_owner, matrix.image) || '' }}
        run: |
          sh .github/scripts/discord-notifier.sh \
              --type "image-start" \
              --profile "${PROFILE}" \
              --image-name "${IMAGE_NAME}" \
              --run-url "${RUN_URL}" \
              --repository "${REPOSITORY}" \
              --ref-name "${REF_NAME}" \
              --workflow-name "${WORKFLOW_NAME}" \
              --actor "${ACTOR}" \
              --ghcr-image "${GHCR_IMAGE}" \
              --dockerhub-image "${DOCKERHUB_IMAGE}" \
              --platforms "linux/amd64,linux/arm64,linux/arm/v7"

  #
  # Prove that the generator, image, hardened runtime, and dependency scan all
  # pass before any registry receives a new manifest.
  #
  test-image:
    name: "Inspect Maraudarr's Tools 🧪"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      #
      # Check out without retaining credentials, then exercise the same local
      # test entrypoint contributors use before building the image.
      #
      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # Run the Maraudarr generator against the checked-in presets and service
      # definitions to ensure they all produce valid stacks.
      #
      - name: "Test the Stack Charts 🔎"
        run: make test

      #
      # Enforce the same Python lint, formatting, and repository checks after merges and before releases.
      #
      - name: "Scrub the Python Deck 🧽"
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

      #
      # Build one local architecture for runtime and vulnerability inspection.
      # The later publishing job owns the multi-architecture registry build.
      #
      - name: "Build the Local Maraudarr Image ⚒️"
        run: >-
          make build
          MARAUDARR_IMAGE=ghcr.io/${{ github.repository_owner }}/maraudarr:scan
          MARAUDARR_BUILD_OPTIONS=--pull

      #
      # Run the hardened smoke voyage with a Plundarr preset and a few selectable
      # services. This exercises the generator and the hardened image together.
      #
      - name: "Run the Hardened Smoke Voyage ⚓"
        run: >-
          make test-image
          MARAUDARR_IMAGE=ghcr.io/${{ github.repository_owner }}/maraudarr:scan
          MARAUDARR_TEST_PRESET=plundarr
          MARAUDARR_TEST_ADD=apprise,jellyfin
          MARAUDARR_TEST_FILE=config/homepage/services.yaml

      #
      # Keep HIGH and CRITICAL fixed vulnerabilities out of the published image.
      #
      - name: "Scan Maraudarr for Bilge Rot 🔍"
        env:
          TRIVY_SHOW_SUPPRESSED: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/maraudarr:scan
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

          # The exact-path exception expires automatically; retain every other finding.
          trivyignores: .trivyignore.yaml
          exit-code: 1

      #
      # Reproduce the reviewed examples before publication without modifying main.
      #
      - name: "Verify the Reviewed Preset References 🗺️"
        run: >-
          make test-examples
          MARAUDARR_IMAGE=ghcr.io/${{ github.repository_owner }}/maraudarr:scan

  #
  # Publish only after validation succeeds. This job owns registry credentials,
  # OCI metadata, provenance, cross-registry mirroring, and release notices.
  #
  publish-image:
    name: "Publish the Multi-Arch Fleet 📦"
    if: github.event_name != 'pull_request'
    needs: test-image
    runs-on: ubuntu-latest
    outputs:
      maraudarr-publication: ${{ steps.publish.outcome }}
      maraudarr-tags: ${{ steps.metadata.outputs.tags }}
      maraudarr-digest: ${{ steps.publish.outputs.digest }}
      maraudarr-result: ${{ steps.publish.outcome == 'success' && steps.attest.outcome == 'success' && steps.verify-mirror.outcome == 'success' && steps.overview.outcome == 'success' && 'success' || '' }}
      maraudarr-stage: >-
        ${{ steps.release-check.outcome == 'failure' && 'Release tag validation'
            || steps.publish.outcome == 'failure' && 'Build or GHCR publication'
            || steps.attest.outcome == 'failure' && 'GHCR provenance attestation'
            || steps.mirror.outcome == 'failure' && 'Docker Hub mirror'
            || steps.verify-mirror.outcome == 'failure' && 'Registry digest verification'
            || steps.overview.outcome == 'failure' && 'Docker Hub description update'
            || 'Publication or required verification' }}
      maraudarr-mirror: ${{ steps.mirror.outcome }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/maraudarr
      DOCKERHUB_IMAGE: docker.io/${{ github.repository_owner }}/maraudarr
      IMAGE_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

    steps:
      #
      # Check out complete history without persistent credentials so release
      # tags can be verified before any registry action begins.
      #
      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      #
      # Accept only annotated semantic-version tags whose commits already
      # belong to main before any release image can be published.
      #
      - name: "Inspect the Release Chart 🧭"
        id: release-check
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          .github/scripts/validate-release-tag.sh \
            --release-tag "${{ github.ref_name }}" \
            --release-sha "${{ github.sha }}"

      #
      # Register QEMU emulation so Buildx can assemble every supported target
      # architecture on the hosted runner.
      #
      - name: "Summon Cross-Arch Cannons 🧨"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4

      #
      # Create the Buildx builder that produces one multi-architecture manifest.
      #
      - name: "Sharpen the Build Axe 🪓"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      #
      # Authenticate to GHCR with the job-scoped token before publishing images.
      #
      - name: "Board the GHCR Galleon 🔐"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #
      # Derive the shared edge, commit, and semantic-version channels from the
      # ref. Stable releases own latest plus minor and major aliases, while
      # prereleases retain only their exact version.
      #
      - name: "Chart Stable and Edge Tags 🏷️"
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      #
      # Record one UTC creation timestamp for the image's OCI metadata.
      #
      - name: "Stamp the Build Time ⏱️"
        id: build-data
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      #
      # Build once, push the multi-architecture result to GHCR, attach SBOM and
      # provenance data, and publish a registry-backed build attestation.
      #
      - name: "Publish the Maraudarr Image 🚢"
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.title=Maraudarr
            index:org.opencontainers.image.description=Generate polished, reusable Plundarr Docker Compose stacks and config directories.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
          build-args: |
            ALPINE_TAG=3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
            DOCKER_COMPOSE_TAG=v5.7.0@sha256:a4de4851b16f18634f74de66f126d5de65f7c5cb5a9502d67ab83e9a96041a70
            IMAGE_CREATED=${{ steps.build-data.outputs.created }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.metadata.outputs.version }}
          sbom: true
          provenance: true

      #
      # Attach GitHub-verified provenance to the exact GHCR digest just pushed.
      #
      - name: "Stamp the Provenance Scroll 🧾"
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      #
      # Copy every generated GHCR tag to Docker Hub without rebuilding. Digest
      # comparison then proves both registries expose the same manifest content.
      #
      - name: "Install the Registry Mirror 🪞"
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      #
      # Copy every published GHCR tag to Docker Hub without rebuilding the image.
      #
      - name: "Mirror Every Tag to Docker Hub 🐳"
        id: mirror
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          sh .github/scripts/registry-mirror.sh \
              --mirror \
              --ghcr-image         "${GHCR_IMAGE}" \
              --dockerhub-image    "${DOCKERHUB_IMAGE}" \
              --ghcr-username      "${GHCR_USERNAME}" \
              --dockerhub-username "${DOCKERHUB_USERNAME}" \
              --published-tags     "${PUBLISHED_TAGS}"

      #
      # Compare mirrored manifest digests before updating public documentation.
      #
      - name: "Verify the Registry Mirrors 🔎"
        id: verify-mirror
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          sh .github/scripts/registry-mirror.sh \
              --verify \
              --ghcr-image         "${GHCR_IMAGE}" \
              --dockerhub-image    "${DOCKERHUB_IMAGE}" \
              --ghcr-username      "${GHCR_USERNAME}" \
              --dockerhub-username "${DOCKERHUB_USERNAME}" \
              --published-tags     "${PUBLISHED_TAGS}"

      #
      # Keep the Docker Hub landing page synchronized with the checked-in public
      # image documentation after the registry contents have been verified.
      #
      - name: "Update the Docker Hub Chart 📘"
        id: overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository_owner }}/maraudarr
          short-description: "Generate polished Plundarr Docker Compose stacks from presets and selectable services."
          readme-filepath: ./docs/docker-hub-description.md

  #
  # Report image evidence even when validation fails or publication is skipped.
  # Delivery failures never change publication results or stop another destination.
  #
  notify-result:
    name: "Read the Image Receipts 📣 (${{ matrix.image-name }}, ${{ matrix.profile }})"
    if: always() && github.event_name != 'pull_request'
    needs: [notify-start, test-image, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: maraudarr
            image-name: Maraudarr
            profile: image-primary
            dockerhub: true
          - image: maraudarr
            image-name: Maraudarr
            profile: image-secondary
            dockerhub: true

    steps:
      #
      # Read notification assets without retaining repository credentials.
      #
      - name: "Unpack the Notification Wardrobe 🧰"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # Name only the two notification secrets and keep webhook values out of logs.
      # Guard both routes so an unset webhook cannot select the other server.
      #
      - name: "Notify Discord: image pipeline result 📣"
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ matrix.profile == 'image-primary' && secrets.DISCORD_WEBHOOK_URL || matrix.profile == 'image-secondary' && secrets.DISCORD_HADES_HOOK_URL || '' }}
          IMAGE_NAME: ${{ matrix.image-name }}
          PROFILE: ${{ matrix.profile }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          ACTOR: ${{ github.actor }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DOCKERHUB_IMAGE: ${{ matrix.dockerhub && format('docker.io/{0}/{1}', github.repository_owner, matrix.image) || '' }}
          JOB_STATUS: ${{ needs.publish-image.outputs[format('{0}-result', matrix.image)] || (needs.test-image.result != 'success' && needs.test-image.result) || needs.publish-image.result }}
          PUBLICATION_STATUS: ${{ needs.publish-image.outputs[format('{0}-publication', matrix.image)] }}
          MIRROR_STATUS: ${{ needs.publish-image.outputs[format('{0}-mirror', matrix.image)] }}
          FAILURE_STAGE: ${{ needs.test-image.result != 'success' && 'Image validation' || needs.publish-image.outputs[format('{0}-stage', matrix.image)] }}
          PUBLISHED_TAGS: ${{ needs.publish-image.outputs[format('{0}-tags', matrix.image)] }}
          PUBLISHED_DIGEST: ${{ needs.publish-image.outputs[format('{0}-digest', matrix.image)] }}
          GHCR_PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/${{ matrix.image }}
          DOCKERHUB_URL: ${{ matrix.dockerhub && format('https://hub.docker.com/r/{0}/{1}', github.repository_owner, matrix.image) || '' }}
        run: |
          sh .github/scripts/discord-notifier.sh \
              --type "image-verdict" \
              --profile "${PROFILE}" \
              --image-name "${IMAGE_NAME}" \
              --run-url "${RUN_URL}" \
              --repository "${REPOSITORY}" \
              --ref-name "${REF_NAME}" \
              --workflow-name "${WORKFLOW_NAME}" \
              --actor "${ACTOR}" \
              --ghcr-image "${GHCR_IMAGE}" \
              --job-status "${JOB_STATUS}" \
              --publication-status "${PUBLICATION_STATUS}" \
              --mirror-status "${MIRROR_STATUS}" \
              --failure-stage "${FAILURE_STAGE}" \
              --ghcr-package-url "${GHCR_PACKAGE_URL}" \
              --dockerhub-url "${DOCKERHUB_URL}" \
              --published-tags "${PUBLISHED_TAGS}" \
              --published-digest "${PUBLISHED_DIGEST}"

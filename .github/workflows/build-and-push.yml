# build-and-push.yml: Validate, publish, attest, mirror, and announce Maraudarr.
#

name: "Hoist Maraudarr to the Registry 🏴‍☠️"

#
# Publish changed builds from main and semantic-version tags. The weekly run
# refreshes the moving edge image even when the repository source is unchanged.
# Manual dispatch remains available for an explicit rebuild or recovery run.
#
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.maraudarr.yml"
      - "example.env"
      - "example.maraudarr.env"
      - "test/test-maraudarr-matrix.sh"
      - "Makefile"
      - "LICENSE"
      - "docs/DOCKERHUB_README.md"
      - ".github/workflows/build-and-push.yml"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  #
  # Prove that the generator, image, hardened runtime, and dependency scan all
  # pass before any registry receives a new manifest.
  #
  test-image:
    name: "Inspect Maraudarr's Tools 🧪"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      #
      # Check out without retaining credentials, then exercise the same local
      # test entrypoint contributors use before building the image.
      #
      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: "Test the Stack Charts 🔎"
        run: make test-maraudarr

      #
      # Build one local architecture for runtime and vulnerability inspection.
      # The later publishing job owns the multi-architecture registry build.
      #
      - name: "Build the Local Maraudarr Image ⚒️"
        run: |
          docker build \
            --pull \
            --tag ghcr.io/${{ github.repository_owner }}/maraudarr:scan \
            --file docker/Dockerfile \
            docker

      - name: "Run the Hardened Smoke Voyage ⚓"
        run: |
          mkdir -p "${RUNNER_TEMP}/plundarr-output"
          docker run \
            --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=${RUNNER_TEMP}/plundarr-output,dst=/output" \
            ghcr.io/${{ github.repository_owner }}/maraudarr:scan \
            --plain build --preset plundarr --add apprise,jellyfin
          test -s "${RUNNER_TEMP}/plundarr-output/config/homepage/services.yaml"
          docker compose \
            --env-file "${RUNNER_TEMP}/plundarr-output/.env" \
            -f "${RUNNER_TEMP}/plundarr-output/docker-compose.yml" \
            config \
            --quiet

      #
      # Keep HIGH and CRITICAL fixed vulnerabilities out of the published image.
      # Repository exceptions remain path-scoped and time-limited separately.
      #
      - name: "Scan Maraudarr for Bilge Rot 🔍"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/maraudarr:scan
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: 1

  #
  # Publish only after validation succeeds. This job owns registry credentials,
  # OCI metadata, provenance, cross-registry mirroring, and release notices.
  #
  publish-image:
    name: "Publish the Multi-Arch Fleet 📦"
    if: github.event_name != 'pull_request'
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/maraudarr
      DOCKERHUB_IMAGE: docker.io/${{ github.repository_owner }}/maraudarr
      IMAGE_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

    steps:
      #
      # Announce the start independently to each configured Discord destination.
      # Missing optional webhooks deliberately skip without failing publication.
      #
      - name: "Notify Discord: shipyard opened 📣"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          IMAGE_PLATFORMS: ${{ env.IMAGE_PLATFORMS }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
              echo "DISCORD_WEBHOOK_URL is not set; skipping Discord notification."
              exit 0
          fi

          color=3447003

          payload="$(jq -n \
              --arg title "🏴‍☠️ Shipyard doors are open" \
              --arg description "${WORKFLOW_NAME} is building the fleet. Keep hands, feet, and cursed YAML inside the workflow." \
              --arg url "${RUN_URL}" \
              --arg repository "${REPOSITORY}" \
              --arg ref "${REF_NAME}" \
              --arg actor "${ACTOR}" \
              --arg platforms "${IMAGE_PLATFORMS}" \
              --arg ghcr "${GHCR_IMAGE}" \
              --arg dockerhub "${DOCKERHUB_IMAGE}" \
              --argjson color "${color}" \
              '{
                username: "Maraudarr Deck Crew",
                embeds: [{
                  title: $title,
                  description: $description,
                  url: $url,
                  color: $color,
                  fields: [
                    {name: "🗺️ Repository", value: $repository, inline: true},
                    {name: "🌿 Ref", value: $ref, inline: true},
                    {name: "🧑‍✈️ Captain", value: $actor, inline: true},
                    {name: "🧱 Platforms", value: $platforms, inline: false},
                    {name: "📦 GHCR", value: $ghcr, inline: false},
                    {name: "🐳 Docker Hub", value: $dockerhub, inline: false}
                  ],
                  footer: {text: "Maraudarr Shipyard • bolts tightened, YAML questioned"},
                  timestamp: now | todate
                }]
              }')"

          curl \
              --fail \
              --silent \
              --show-error \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${DISCORD_WEBHOOK_URL}"

      - name: "Notify Hades Discord: kraken awakened 🦑"
        env:
          DISCORD_HADES_HOOK_URL: ${{ secrets.DISCORD_HADES_HOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          IMAGE_PLATFORMS: ${{ env.IMAGE_PLATFORMS }}
        run: |
          if [ -z "${DISCORD_HADES_HOOK_URL}" ]; then
              echo "DISCORD_HADES_HOOK_URL is not set; skipping Hades Discord notification."
              exit 0
          fi

          color=10181046

          payload="$(jq -n \
              --arg title "🦑 Kraken clocked in" \
              --arg description "${WORKFLOW_NAME} started a multi-arch build. The kraken found the button and accepted no training." \
              --arg url "${RUN_URL}" \
              --arg repository "${REPOSITORY}" \
              --arg ref "${REF_NAME}" \
              --arg actor "${ACTOR}" \
              --arg platforms "${IMAGE_PLATFORMS}" \
              --arg ghcr "${GHCR_IMAGE}" \
              --arg dockerhub "${DOCKERHUB_IMAGE}" \
              --argjson color "${color}" \
              '{
                username: "Kraken Build Bureau",
                embeds: [{
                  title: $title,
                  description: $description,
                  url: $url,
                  color: $color,
                  fields: [
                    {name: "⚓ Repository", value: $repository, inline: true},
                    {name: "🌿 Ref", value: $ref, inline: true},
                    {name: "🔘 Button Pusher", value: $actor, inline: true},
                    {name: "🧱 Platforms", value: $platforms, inline: false},
                    {name: "📦 GHCR", value: $ghcr, inline: false},
                    {name: "🐳 Docker Hub", value: $dockerhub, inline: false}
                  ],
                  footer: {text: "Kraken Build Bureau • too many arms, adequate supervision"},
                  timestamp: now | todate
                }]
              }')"

          curl \
              --fail \
              --silent \
              --show-error \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${DISCORD_HADES_HOOK_URL}"

      #
      # Prepare the checked-out source and emulation toolchain used to produce a
      # single manifest list for every supported Maraudarr architecture.
      #
      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: "Summon Cross-Arch Cannons 🧨"
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4

      - name: "Sharpen the Build Axe 🪓"
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: "Board the GHCR Galleon 🔐"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #
      # Derive edge, commit, semantic-version, and latest tags from the ref. The
      # timestamp step supplies reproducible OCI release metadata to the build.
      #
      - name: "Chart Stable and Edge Tags 🏷️"
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: "Stamp the Build Time ⏱️"
        id: build-data
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      #
      # Build once, push the multi-architecture result to GHCR, attach SBOM and
      # provenance data, and publish a registry-backed build attestation.
      #
      - name: "Publish the Maraudarr Image 🚢"
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.title=Maraudarr
            index:org.opencontainers.image.description=Generate polished, reusable Plundarr Docker Compose stacks and config directories.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
          build-args: |
            ALPINE_TAG=3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
            DOCKER_CLI_TAG=29.6.2-cli-alpine3.24@sha256:be132a9f282288de4afaf63379dff75711fda0147c6b72a9df44e51841402144
            DOCKER_COMPOSE_TAG=v5.4.0@sha256:b03e46987ca4ebb41ca31b765ad7ba957388003f1ef1255fd68333a7b838d632
            IMAGE_CREATED=${{ steps.build-data.outputs.created }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.metadata.outputs.version }}
          sbom: true
          provenance: true

      - name: "Stamp the Provenance Scroll 🧾"
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      #
      # Copy every generated GHCR tag to Docker Hub without rebuilding. Digest
      # comparison then proves both registries expose the same manifest content.
      #
      - name: "Install the Registry Mirror 🪞"
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: "Mirror Every Tag to Docker Hub 🐳"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r ghcr_tag; do
            [ -n "${ghcr_tag}" ] || continue
            suffix="${ghcr_tag#"${GHCR_IMAGE}"}"
            dockerhub_tag="${DOCKERHUB_IMAGE}${suffix}"
            skopeo copy \
              --all \
              --preserve-digests \
              --src-creds "${{ github.actor }}:${GHCR_TOKEN}" \
              --dest-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              "docker://${ghcr_tag}" \
              "docker://${dockerhub_tag}"
          done <<< "${PUBLISHED_TAGS}"

      - name: "Verify the Registry Mirrors 🔎"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          primary_tag="$(printf '%s\n' "${PUBLISHED_TAGS}" | sed '/^$/d' | head -n 1)"
          suffix="${primary_tag#"${GHCR_IMAGE}"}"
          dockerhub_tag="${DOCKERHUB_IMAGE}${suffix}"
          ghcr_digest="$(skopeo inspect --creds "${{ github.actor }}:${GHCR_TOKEN}" "docker://${primary_tag}" | jq -r .Digest)"
          dockerhub_digest="$(skopeo inspect --creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" "docker://${dockerhub_tag}" | jq -r .Digest)"
          test "${ghcr_digest}" = "${dockerhub_digest}"
          echo "Registry manifests match at ${ghcr_digest}."

      #
      # Keep the Docker Hub landing page synchronized with the checked-in public
      # image documentation after the registry contents have been verified.
      #
      - name: "Update the Docker Hub Chart 📘"
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository_owner }}/maraudarr
          short-description: "Generate polished Plundarr Docker Compose stacks from presets and selectable services."
          readme-filepath: ./docs/DOCKERHUB_README.md

      #
      # Report the final job state to both optional Discord destinations. These
      # steps run on success or failure so a broken voyage never disappears.
      #
      - name: "Notify Discord: build verdict 📣"
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          GHCR_PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/maraudarr
          DOCKERHUB_URL: https://hub.docker.com/r/${{ github.repository_owner }}/maraudarr
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
              echo "DISCORD_WEBHOOK_URL is not set; skipping Discord notification."
              exit 0
          fi

          if [ "${JOB_STATUS}" = "success" ]; then
              title="✅ Fleet launched"
              description="Maraudarr reached both registries. The manifests agree, which is more than the crew can say."
              color=3066993
          else
              title="💥 Build hit a reef"
              description="Maraudarr ended ${JOB_STATUS}. The logs have been asked to explain themselves."
              color=15158332
          fi

          formatted_tags="$(printf '%s\n' "${PUBLISHED_TAGS:-none}" \
              | sed '/^$/d; s#^'"${GHCR_IMAGE}"':##; s/^/• /')"
          [ -n "${formatted_tags}" ] || formatted_tags="none"
          digest_short="$(printf '%s' "${PUBLISHED_DIGEST:-unavailable}" \
              | sed -E 's/^(sha256:[0-9a-f]{12}).*/\1/')"

          payload="$(jq -n \
              --arg title "${title}" \
              --arg description "${description}" \
              --arg url "${RUN_URL}" \
              --arg repository "${REPOSITORY}" \
              --arg ref "${REF_NAME}" \
              --arg tags "${formatted_tags}" \
              --arg digest "${digest_short}" \
              --arg ghcrUrl "${GHCR_PACKAGE_URL}" \
              --arg dockerhubUrl "${DOCKERHUB_URL}" \
              --argjson color "${color}" \
              '{
                username: "Maraudarr Deck Crew",
                embeds: [{
                  title: $title,
                  description: $description,
                  url: $url,
                  color: $color,
                  fields: [
                    {name: "🗺️ Repository", value: $repository, inline: true},
                    {name: "🌿 Ref", value: $ref, inline: true},
                    {name: "🏷️ Tags", value: $tags, inline: false},
                    {name: "🧾 Digest", value: $digest, inline: false},
                    {name: "📦 GHCR", value: $ghcrUrl, inline: false},
                    {name: "🐳 Docker Hub", value: $dockerhubUrl, inline: false}
                  ],
                  footer: {text: "Maraudarr Shipyard • receipts attached"},
                  timestamp: now | todate
                }]
              }')"

          curl \
              --fail \
              --silent \
              --show-error \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${DISCORD_WEBHOOK_URL}"

      - name: "Notify Hades Discord: kraken verdict 🦑"
        if: always()
        env:
          DISCORD_HADES_HOOK_URL: ${{ secrets.DISCORD_HADES_HOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          GHCR_PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/maraudarr
          DOCKERHUB_URL: https://hub.docker.com/r/${{ github.repository_owner }}/maraudarr
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if [ -z "${DISCORD_HADES_HOOK_URL}" ]; then
              echo "DISCORD_HADES_HOOK_URL is not set; skipping Hades Discord notification."
              exit 0
          fi

          if [ "${JOB_STATUS}" = "success" ]; then
              title="🦑 Kraken stamped approved"
              description="Images published on every architecture. The kraken requests credit for standing nearby."
              color=3066993
          else
              title="🦑 Kraken misplaced the build"
              description="Publication ended ${JOB_STATUS}. All tentacles point at the logs."
              color=15158332
          fi

          formatted_tags="$(printf '%s\n' "${PUBLISHED_TAGS:-none}" \
              | sed '/^$/d; s#^'"${GHCR_IMAGE}"':##; s/^/• /')"
          [ -n "${formatted_tags}" ] || formatted_tags="none"
          digest_short="$(printf '%s' "${PUBLISHED_DIGEST:-unavailable}" \
              | sed -E 's/^(sha256:[0-9a-f]{12}).*/\1/')"

          payload="$(jq -n \
              --arg title "${title}" \
              --arg description "${description}" \
              --arg url "${RUN_URL}" \
              --arg repository "${REPOSITORY}" \
              --arg ref "${REF_NAME}" \
              --arg tags "${formatted_tags}" \
              --arg digest "${digest_short}" \
              --arg ghcrUrl "${GHCR_PACKAGE_URL}" \
              --arg dockerhubUrl "${DOCKERHUB_URL}" \
              --argjson color "${color}" \
              '{
                username: "Kraken Build Bureau",
                embeds: [{
                  title: $title,
                  description: $description,
                  url: $url,
                  color: $color,
                  fields: [
                    {name: "⚓ Repository", value: $repository, inline: true},
                    {name: "🌿 Ref", value: $ref, inline: true},
                    {name: "🏷️ Tags", value: $tags, inline: false},
                    {name: "🧾 Digest", value: $digest, inline: false},
                    {name: "📦 GHCR", value: $ghcrUrl, inline: false},
                    {name: "🐳 Docker Hub", value: $dockerhubUrl, inline: false}
                  ],
                  footer: {text: "Kraken Build Bureau • eight arms, one incident report"},
                  timestamp: now | todate
                }]
              }')"

          curl \
              --fail \
              --silent \
              --show-error \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${DISCORD_HADES_HOOK_URL}"

name: "Hoist Maraudarr to the Registry 🏴‍☠️"

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.maraudarr.yml"
      - "example.env"
      - "example.maraudarr.env"
      - "test/test-maraudarr-matrix.sh"
      - "Makefile"
      - "LICENSE"
      - "docs/DOCKERHUB_README.md"
      - ".github/workflows/build-and-push.yml"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-image:
    name: "Inspect Maraudarr's Tools 🧪"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: "Test the Stack Charts 🔎"
        run: make test-maraudarr

      - name: "Build the Local Maraudarr Image ⚒️"
        run: |
          docker build \
            --pull \
            --tag ghcr.io/${{ github.repository_owner }}/maraudarr:scan \
            --file docker/Dockerfile \
            docker

      - name: "Run the Hardened Smoke Voyage ⚓"
        run: |
          mkdir -p "${RUNNER_TEMP}/plundarr-output"
          docker run \
            --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=${RUNNER_TEMP}/plundarr-output,dst=/output" \
            ghcr.io/${{ github.repository_owner }}/maraudarr:scan \
            --plain build --preset plundarr --add apprise,jellyfin
          test -s "${RUNNER_TEMP}/plundarr-output/config/homepage/services.yaml"
          docker compose \
            --env-file "${RUNNER_TEMP}/plundarr-output/.env" \
            -f "${RUNNER_TEMP}/plundarr-output/docker-compose.yml" \
            config \
            --quiet

      - name: "Scan Maraudarr for Bilge Rot 🔍"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/maraudarr:scan
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: 1

  publish-image:
    name: "Publish the Multi-Arch Fleet 📦"
    if: github.event_name != 'pull_request'
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/maraudarr
      DOCKERHUB_IMAGE: docker.io/${{ github.repository_owner }}/maraudarr
      IMAGE_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

    steps:
      - name: "Notify Discord: shipyard opened 📣"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          IMAGE_PLATFORMS: ${{ env.IMAGE_PLATFORMS }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
              echo "DISCORD_WEBHOOK_URL is not set; skipping Discord notification."
              exit 0
          fi

          embed_colors=(16711884 15961002 11685080 10181046 15844367 16738740)
          color="${embed_colors[$((RANDOM % ${#embed_colors[@]}))]}"

          payload="$(jq -n \
              --arg title "🏴‍☠️ Maraudarr entered the shipyard, divas" \
              --arg description "${WORKFLOW_NAME} slapped on a tricorn and ordered a multi-arch fleet. OSHA has left the chat." \
              --arg url "${RUN_URL}" \
              --arg repository "${REPOSITORY}" \
              --arg ref "${REF_NAME}" \
              --arg actor "${ACTOR}" \
              --arg platforms "${IMAGE_PLATFORMS}" \
              --arg ghcr "${GHCR_IMAGE}" \
              --arg dockerhub "${DOCKERHUB_IMAGE}" \
              --argjson color "${color}" \
              '{
                username: "Maraudarr Deck Crew",
                embeds: [{
                  title: $title,
                  description: $description,
                  url: $url,
                  color: $color,
                  fields: [
                    {name: "🗺️ Gossip Map", value: $repository, inline: true},
                    {name: "🌿 Serving Ref", value: $ref, inline: true},
                    {name: "💅 Chaos Commodore", value: $actor, inline: true},
                    {name: "🧱 Three-Way Fleet", value: $platforms, inline: false},
                    {name: "📦 GHCR Treasure Chest", value: $ghcr, inline: false},
                    {name: "🐳 Docker Hub Cruise", value: $dockerhub, inline: false}
                  ],
                  footer: {text: "Maraudarr shipyard: queer, seaworthy, over-accessorized"},
                  timestamp: now | todate
                }]
              }')"

          curl \
              --fail \
              --silent \
              --show-error \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${DISCORD_WEBHOOK_URL}"

      - name: "Notify Hades Discord: kraken awakened 🦑"
        env:
          DISCORD_HADES_HOOK_URL: ${{ secrets.DISCORD_HADES_HOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          IMAGE_PLATFORMS: ${{ env.IMAGE_PLATFORMS }}
        run: |
          if [ -z "${DISCORD_HADES_HOOK_URL}" ]; then
              echo "DISCORD_HADES_HOOK_URL is not set; skipping Hades Discord notification."
              exit 0
          fi

          embed_colors=(16711884 15961002 11685080 10181046 15844367 16738740)
          color="${embed_colors[$((RANDOM % ${#embed_colors[@]}))]}"

          payload="$(jq -n \
              --arg title "🦑 The kraken put on eyeliner. Build time." \
              --arg description "${WORKFLOW_NAME} sashayed into dry dock with a cutlass, a blueprint, and absolutely no indoor voice." \
              --arg url "${RUN_URL}" \
              --arg repository "${REPOSITORY}" \
              --arg ref "${REF_NAME}" \
              --arg actor "${ACTOR}" \
              --arg platforms "${IMAGE_PLATFORMS}" \
              --arg ghcr "${GHCR_IMAGE}" \
              --arg dockerhub "${DOCKERHUB_IMAGE}" \
              --argjson color "${color}" \
              '{
                username: "Kraken Build Bureau",
                embeds: [{
                  title: $title,
                  description: $description,
                  url: $url,
                  color: $color,
                  fields: [
                    {name: "⚓ Wet Little Repo", value: $repository, inline: true},
                    {name: "💄 Glossy Ref", value: $ref, inline: true},
                    {name: "🧜 Summoning Siren", value: $actor, inline: true},
                    {name: "🧱 Tentacle Rack", value: $platforms, inline: false},
                    {name: "📦 GHCR Booty", value: $ghcr, inline: false},
                    {name: "🐳 Docker Diva Dock", value: $dockerhub, inline: false}
                  ],
                  footer: {text: "Kraken Build Bureau: salty, sparkly, OCI-compliant"},
                  timestamp: now | todate
                }]
              }')"

          curl \
              --fail \
              --silent \
              --show-error \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${DISCORD_HADES_HOOK_URL}"

      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: "Summon Cross-Arch Cannons 🧨"
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4

      - name: "Sharpen the Build Axe 🪓"
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: "Board the GHCR Galleon 🔐"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Chart Stable and Edge Tags 🏷️"
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: "Stamp the Build Time ⏱️"
        id: build-data
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: "Publish the Maraudarr Image 🚢"
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.title=Maraudarr
            index:org.opencontainers.image.description=Generate polished, reusable Plundarr Docker Compose stacks and config directories.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
          build-args: |
            ALPINE_TAG=3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
            DOCKER_CLI_TAG=29.6.2-cli-alpine3.24@sha256:be132a9f282288de4afaf63379dff75711fda0147c6b72a9df44e51841402144
            IMAGE_CREATED=${{ steps.build-data.outputs.created }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.metadata.outputs.version }}
          sbom: true
          provenance: true

      - name: "Stamp the Provenance Scroll 🧾"
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: "Install the Registry Mirror 🪞"
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: "Mirror Every Tag to Docker Hub 🐳"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r ghcr_tag; do
            [ -n "${ghcr_tag}" ] || continue
            suffix="${ghcr_tag#"${GHCR_IMAGE}"}"
            dockerhub_tag="${DOCKERHUB_IMAGE}${suffix}"
            skopeo copy \
              --all \
              --preserve-digests \
              --src-creds "${{ github.actor }}:${GHCR_TOKEN}" \
              --dest-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              "docker://${ghcr_tag}" \
              "docker://${dockerhub_tag}"
          done <<< "${PUBLISHED_TAGS}"

      - name: "Verify the Registry Mirrors 🔎"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          primary_tag="$(printf '%s\n' "${PUBLISHED_TAGS}" | sed '/^$/d' | head -n 1)"
          suffix="${primary_tag#"${GHCR_IMAGE}"}"
          dockerhub_tag="${DOCKERHUB_IMAGE}${suffix}"
          ghcr_digest="$(skopeo inspect --creds "${{ github.actor }}:${GHCR_TOKEN}" "docker://${primary_tag}" | jq -r .Digest)"
          dockerhub_digest="$(skopeo inspect --creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" "docker://${dockerhub_tag}" | jq -r .Digest)"
          test "${ghcr_digest}" = "${dockerhub_digest}"
          echo "Registry manifests match at ${ghcr_digest}."

      - name: "Update the Docker Hub Chart 📘"
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository_owner }}/maraudarr
          short-description: "Generate polished Plundarr Docker Compose stacks from presets and selectable services."
          readme-filepath: ./docs/DOCKERHUB_README.md

      - name: "Notify Discord: fleet gossip 📣"
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          GHCR_PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/maraudarr
          DOCKERHUB_URL: https://hub.docker.com/r/${{ github.repository_owner }}/maraudarr
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
              echo "DISCORD_WEBHOOK_URL is not set; skipping Discord notification."
              exit 0
          fi

          if [ "${JOB_STATUS}" = "success" ]; then
              title="✅ Fleet launched. Wig secured."
              description="Fresh Maraudarr images are serving multi-arch realness. The registries have been boarded and nobody chipped a nail."
          else
              title="💥 Shipwreck, but make it fashion"
              description="The Maraudarr voyage ended ${JOB_STATUS}. Somebody fetch the logs, the lifeboats, and a stronger setting spray."
          fi
          embed_colors=(16711884 15961002 11685080 10181046 15844367 16738740)
          color="${embed_colors[$((RANDOM % ${#embed_colors[@]}))]}"

          formatted_tags="$(printf '%s\n' "${PUBLISHED_TAGS:-none}" \
              | sed '/^$/d; s#^'"${GHCR_IMAGE}"':##; s/^/• /')"
          [ -n "${formatted_tags}" ] || formatted_tags="none"
          digest_short="$(printf '%s' "${PUBLISHED_DIGEST:-unavailable}" \
              | sed -E 's/^(sha256:[0-9a-f]{12}).*/\1/')"

          payload="$(jq -n \
              --arg title "${title}" \
              --arg description "${description}" \
              --arg url "${RUN_URL}" \
              --arg repository "${REPOSITORY}" \
              --arg ref "${REF_NAME}" \
              --arg tags "${formatted_tags}" \
              --arg digest "${digest_short}" \
              --arg ghcrUrl "${GHCR_PACKAGE_URL}" \
              --arg dockerhubUrl "${DOCKERHUB_URL}" \
              --argjson color "${color}" \
              '{
                username: "Maraudarr Deck Crew",
                embeds: [{
                  title: $title,
                  description: $description,
                  url: $url,
                  color: $color,
                  fields: [
                    {name: "🗺️ Ship Manifest", value: $repository, inline: true},
                    {name: "🌿 Drama Ref", value: $ref, inline: true},
                    {name: "🏷️ Fresh Lewks", value: $tags, inline: false},
                    {name: "🧾 Registry Fingerprint", value: $digest, inline: false},
                    {name: "📦 GHCR Treasure Room", value: $ghcrUrl, inline: false},
                    {name: "🐳 Docker Hub Cabaret", value: $dockerhubUrl, inline: false}
                  ],
                  footer: {text: "Maraudarr: plundered, powdered, published"},
                  timestamp: now | todate
                }]
              }')"

          curl \
              --fail \
              --silent \
              --show-error \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${DISCORD_WEBHOOK_URL}"

      - name: "Notify Hades Discord: kraken verdict 🦑"
        if: always()
        env:
          DISCORD_HADES_HOOK_URL: ${{ secrets.DISCORD_HADES_HOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          GHCR_PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/maraudarr
          DOCKERHUB_URL: https://hub.docker.com/r/${{ github.repository_owner }}/maraudarr
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if [ -z "${DISCORD_HADES_HOOK_URL}" ]; then
              echo "DISCORD_HADES_HOOK_URL is not set; skipping Hades Discord notification."
              exit 0
          fi

          if [ "${JOB_STATUS}" = "success" ]; then
              title="🌈 Kraken approved the fit"
              description="Maraudarr escaped the shipyard polished, published, and offensively buoyant. Every architecture got an invite."
          else
              title="🦑 Kraken ate the build"
              description="The registry ritual ended ${JOB_STATUS}. The tentacles deny everything; the logs know better."
          fi
          embed_colors=(16711884 15961002 11685080 10181046 15844367 16738740)
          color="${embed_colors[$((RANDOM % ${#embed_colors[@]}))]}"

          formatted_tags="$(printf '%s\n' "${PUBLISHED_TAGS:-none}" \
              | sed '/^$/d; s#^'"${GHCR_IMAGE}"':##; s/^/• /')"
          [ -n "${formatted_tags}" ] || formatted_tags="none"
          digest_short="$(printf '%s' "${PUBLISHED_DIGEST:-unavailable}" \
              | sed -E 's/^(sha256:[0-9a-f]{12}).*/\1/')"

          payload="$(jq -n \
              --arg title "${title}" \
              --arg description "${description}" \
              --arg url "${RUN_URL}" \
              --arg repository "${REPOSITORY}" \
              --arg ref "${REF_NAME}" \
              --arg tags "${formatted_tags}" \
              --arg digest "${digest_short}" \
              --arg ghcrUrl "${GHCR_PACKAGE_URL}" \
              --arg dockerhubUrl "${DOCKERHUB_URL}" \
              --argjson color "${color}" \
              '{
                username: "Kraken Build Bureau",
                embeds: [{
                  title: $title,
                  description: $description,
                  url: $url,
                  color: $color,
                  fields: [
                    {name: "⚓ Moisturized Manifest", value: $repository, inline: true},
                    {name: "💄 Glossy Ref", value: $ref, inline: true},
                    {name: "🏷️ Hemmed Tags", value: $tags, inline: false},
                    {name: "🧾 Salty Sigil", value: $digest, inline: false},
                    {name: "📦 GHCR Booty Call", value: $ghcrUrl, inline: false},
                    {name: "🐳 Docker Diva Dock", value: $dockerhubUrl, inline: false}
                  ],
                  footer: {text: "Kraken Build Bureau: gay panic, zero-downtime"},
                  timestamp: now | todate
                }]
              }')"

          curl \
              --fail \
              --silent \
              --show-error \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${DISCORD_HADES_HOOK_URL}"

#
# validate-pr.yml: Validate Plundarr charts and the complete Maraudarr image.
#

name: "Inspect the Boarding Pass 🧪🏴‍☠️"

#
# Run the full validation voyage for every pull request targeting main. The
# broad path rule makes this the repository's dependable merge gate.
#
on:
  pull_request:
    branches:
      - main
    paths:
      - "**"
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Expected PR commit after an automated example refresh"
        required: false
        type: string

permissions:
  contents: read

jobs:
  #
  # Exercise source generation, runtime hardening, multi-architecture builds,
  # vulnerability policy, and repository linting in one read-only job.
  #
  validate-pr:
    name: "Validate the Plundarr and Maraudarr Charts 🧭"
    runs-on: ubuntu-latest
    outputs:
      examples_changed: ${{ steps.example-diff.outputs.changed }}
    permissions:
      contents: read

    steps:
      #
      # Check out without persistent credentials and prepare emulation plus
      # Buildx before any architecture-sensitive validation begins.
      #
      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # A dispatched recheck must inspect the exact bot commit, never a newer branch tip.
      #
      - name: "Confirm the Requested Commit 🧭"
        if: github.event_name == 'workflow_dispatch' && inputs.expected_head_sha != ''
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      #
      # Set up QEMU for cross-architecture builds and tests.
      #
      - name: "Summon Cross-Arch Cannons 🧨"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4

      #
      # Set up Buildx for cross-architecture builds and tests.
      #
      - name: "Sharpen the Build Axe 🪓"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      #
      # Validate Maraudarr's unit, image-fallback, and representative
      # Compose generation tests.
      #
      - name: "Test Maraudarr's Charts 🧰"
        run: make test

      #
      # Build the publishable image shape, then run it with the same
      # read-only, networkless, unprivileged contract promised to users.
      #
      - name: "Build the Published Maraudarr Shape 📦"
        run: >-
          make build
          MARAUDARR_IMAGE=maraudarr:pr
          MARAUDARR_BUILD_OPTIONS=--pull

      #
      # Run the hardened smoke voyage with a plundarr preset and a few selectable services.
      # The smoke test is deliberately not exhaustive, but it does exercise the Maraudarr
      # generator, the hardened runtime, and the selected services to ensure they all work
      # together in a basic configuration.
      #
      - name: "Smoke-Test Containerized Maraudarr ⚓"
        run: >-
          make test-image
          MARAUDARR_IMAGE=maraudarr:pr
          MARAUDARR_TEST_PRESET=boudoirr

      #
      # Prove every supported target architecture builds before enforcing
      # the repository's HIGH and CRITICAL vulnerability threshold.
      #
      - name: "Test the Three-Deck Hull Plan 🛠️"
        run: make build-platforms

      #
      # Scan for vulnerabilities in the built image.
      #
      - name: "Scan Maraudarr for Bilge Rot 🔍"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: maraudarr:pr
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: 1

      #
      # Generate every preset with the image just built from this PR. Stage only public
      # pairs so secret and syntax checks include newly introduced presets as well.
      #
      - name: "Refresh the Preset Reference Fleet 🗺️"
        run: |
          make examples MARAUDARR_IMAGE=maraudarr:pr
          git add -- examples/presets

      #
      # Finish with all repository formatting, secret, workflow, YAML, and
      # shell checks so generated artifacts cannot hide basic quality drift.
      #
      - name: "Fire the Pre-Commit Cannons 💥"
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

      #
      # Export only the validated public pairs. Fork contributors can download these
      # files without granting repository write permissions to their generator code.
      #
      - name: "Pack the Public Preset References 📦"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: preset-examples
          path: |
            examples/presets/*/docker-compose.yml
            examples/presets/*/example.env
          if-no-files-found: error
          retention-days: 7

      #
      # Report drift only after every validation succeeds, allowing a separate job
      # to refresh eligible PR branches without treating other failures as approval.
      #
      - name: "Compare the Reviewed Preset References 🔎"
        id: example-diff
        run: |
          if git diff --quiet HEAD -- examples/presets; then
              echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
              echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      #
      # Keep the existing required merge check red until the updated commit is tested.
      #
      - name: "Require Current Preset References ⚓"
        if: steps.example-diff.outputs.changed == 'true'
        run: |
          echo "::error::Preset examples need refreshing. Same-repository PRs are updated automatically; fork contributors can download the preset-examples artifact or run make build examples."
          exit 1

  #
  # Build the source-derived Python reference separately so documentation
  # dependencies never enter the published Maraudarr runtime image.
  #
  validate-docs:
    name: "Validate the Developer Charts 📚"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      #
      # Check out without persistent credentials and prepare the Python
      # environment before documentation-sensitive validation begins.
      #
      - name: "Grab the Source Charts 📖"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # Set up Python for documentation validation.
      #
      - name: "Ready the Python Quill 🪶"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      #
      # Install only exact, hash-verified documentation dependencies.
      #
      - name: "Load the Documentation Tools 🧰"
        run: make docs-install

      #
      # Render the documentation to ensure all source charts and references are
      # valid.
      #
      - name: "Render Every Developer Chart 🔎"
        run: make docs

  #
  # Separate repository writes from PR execution. Only same-repository PRs qualify,
  # and the updater itself comes from the reviewed base commit rather than PR code.
  #
  update-examples:
    name: "Update the PR's Preset References 🗺️"
    needs:
      - validate-pr
      - validate-docs
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.validate-pr.outputs.examples_changed == 'true' &&
      needs.validate-docs.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    concurrency:
      group: preset-examples-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      #
      # Run only the trusted base helper, with no PR checkout or persisted token.
      #
      - name: "Read the Reviewed Update Helper 📖"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      #
      # Artifact files are bounded data inputs; the updater never executes them.
      #
      - name: "Unpack the Validated References 📦"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: preset-examples
          path: ${{ runner.temp }}/preset-examples

      #
      # Use non-forced Git object updates, then explicitly dispatch both validators
      # because repository-token pushes do not reliably trigger the required checks.
      #
      - name: "Commit References to the Current PR Branch 🧭"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/update_preset_examples.py \
              --repository "${REPOSITORY}" \
              --pull-request "${PR_NUMBER}" \
              --expected-head-sha "${EXPECTED_HEAD_SHA}" \
              --artifact "${RUNNER_TEMP}/preset-examples"

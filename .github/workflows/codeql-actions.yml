#
# codeql-actions.yml: Analyze Maraudarr Python and GitHub Actions source.
#

name: "Interrogate the Maraudarr Rigging 🔎"

#
# Inspect every change entering main, every resulting main commit, and any
# manually requested security review.
#
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  #
  # Run the same CodeQL lifecycle independently for Python and workflow source.
  # One language failure does not cancel the other language's useful results.
  #
  codeql:
    name: "Inspect Python and Actions 🧪"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python

    steps:
      #
      # Checkout is read-only; CodeQL alone receives permission to publish its
      # analysis results into GitHub code scanning.
      #
      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # Initialize CodeQL for the current matrix language before analysis begins.
      #
      - name: "Wake the CodeQL Spyglass 🔭"
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          languages: ${{ matrix.language }}

      #
      # Analyze the initialized language and keep findings separated by matrix
      # category so Python and Actions results remain easy to distinguish.
      #
      - name: "Read Maraudarr's Scrolls 📜"
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          category: "/language:${{ matrix.language }}"
